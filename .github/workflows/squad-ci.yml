name: Squad CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-and-unit-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Restore dependencies
        run: dotnet restore CFPCompass.sln

      - name: Build
        run: dotnet build CFPCompass.sln --no-restore --configuration Release

      - name: Run unit tests
        run: >
          dotnet test CFPCompass.sln
          --no-build
          --configuration Release
          --filter "Category!=Integration"
          --logger trx
          --results-directory ./TestResults

      - name: Upload unit test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: ./TestResults

  integration-test:
    runs-on: ubuntu-latest
    # ubuntu-latest includes Docker by default — required for Azurite container
    needs: build-and-unit-test
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Start Azurite
        run: |
          docker run -d \
            -p 10000:10000 -p 10001:10001 -p 10002:10002 \
            mcr.microsoft.com/azure-storage/azurite \
            azurite --skipApiVersionCheck --blobHost 0.0.0.0 --queueHost 0.0.0.0 --tableHost 0.0.0.0
          sleep 5

      - name: Restore dependencies
        run: dotnet restore CFPCompass.sln

      - name: Start Azurite emulator
        run: |
          docker run -d \
            --name azurite \
            -p 10000:10000 \
            -p 10001:10001 \
            -p 10002:10002 \
            mcr.microsoft.com/azure-storage/azurite
          # Wait for Azurite Blob service to be ready (max 30 seconds)
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:10000/ > /dev/null 2>&1; then
              echo "Azurite ready after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "Azurite did not become ready within 30 seconds" >&2
          exit 1

      - name: Run integration tests
        run: >
          dotnet test tests/CfpCompass.Api.Tests/CfpCompass.Api.Tests.csproj
          --configuration Release
          --filter "Category=Integration"
          --logger trx
          --results-directory ./TestResults

      - name: Upload integration test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-results
          path: ./TestResults
