name: Squad CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-and-unit-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Restore dependencies
        run: dotnet restore CFPCompass.sln

      - name: Build
        run: dotnet build CFPCompass.sln --no-restore --configuration Release

      - name: Run unit tests
        run: >
          dotnet test CFPCompass.sln
          --no-build
          --configuration Release
          --filter "Category!=Integration"
          --logger trx
          --results-directory ./TestResults

      - name: Upload unit test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: ./TestResults

  integration-test:
    runs-on: ubuntu-latest
    needs: build-and-unit-test
    services:
      azurite:
        image: mcr.microsoft.com/azure-storage/azurite
        ports:
          - 10000:10000
          - 10001:10001
          - 10002:10002
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Restore dependencies
        run: dotnet restore CFPCompass.sln

      - name: Run integration tests
        run: >
          dotnet test tests/CfpCompass.Api.Tests/CfpCompass.Api.Tests.csproj
          --configuration Release
          --filter "Category=Integration"
          --logger trx
          --results-directory ./TestResults

      - name: Upload integration test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-results
          path: ./TestResults
